<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>soundpost</title>
<style>
body{font-family:monospace;background:#111;color:#eee;margin:0;padding:1rem;max-width:640px}
textarea{width:100%;background:#222;color:#ccc;padding:.5rem;border:none;border-radius:.25rem;box-sizing:border-box}
button{margin:.25rem .25rem .25rem 0;padding:.5rem 1rem;background:#444;color:#eee;border:none;border-radius:.25rem;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button.go{background:#2c4a33}
#status{font-size:.85rem;color:#8fd4a0;margin:.5rem 0;min-height:1.2em}
#status.bad{color:#c47a6a}
#log{font-size:.8rem;height:120px;overflow:auto;background:#222;color:#999;padding:.5rem;margin-top:.5rem;border-radius:.25rem}
#meter{width:100%;height:20px;background:#222;border-radius:.25rem;margin-top:.5rem}
</style>
</head>
<body>
<h1>soundpost</h1>
<p>send text by sound. no internet. speaker on one side, mic on the other.</p>

<h2>send</h2>
<textarea id="msg" rows="2" placeholder="type here...">hello</textarea><br>
<button id="play" class="go">play</button>
<button id="stopPlay">stop</button>
<button id="save">save wav</button>

<h2>receive</h2>
<textarea id="out" rows="3" readonly placeholder="decoded text shows up here..."></textarea><br>
<button id="rec" class="go">start recording</button>
<button id="dec" disabled>stop + decode</button><br>
<input type="file" id="wavfile" accept="audio/*" style="margin-top:.5rem">
<canvas id="meter" width="600" height="20"></canvas>
<div id="status"></div>

<h2>log</h2>
<div id="log"></div>

<script>
// ---------- pure audio stuff (no dom in here, tested by roundtrip.js) ----------
var TONES = {'a':[200,280],'b':[300,380],'c':[400,480],'d':[500,580],'e':[600,680],'f':[700,780],'g':[800,880],'h':[900,980],
  'i':[1000,1080],'j':[1100,1180],'k':[1200,1280],'l':[1300,1380],'m':[1400,1480],'n':[1500,1580],'o':[1600,1680],
  'p':[1700,1780],'q':[1800,1880],'r':[1900,1980],'s':[2000,2100],'t':[2200,2300],'u':[2400,2500],'v':[2600,2700],
  'w':[2800,2900],'x':[3000,3100],'y':[3200,3300],'z':[3400,3500],'0':[3600,3700],'1':[3800,3900],'2':[4000,4100],
  '3':[4200,4300],'4':[4400,4500],'5':[4600,4700],'6':[4800,4900],'7':[5000,5100],'8':[5200,5300],'9':[5400,5500],
  ' ':[5600,5800],'.':[5900,5950],',':[6000,6050],'?':[6100,6150],'!':[6200,6250],'-':[6300,6350],'@':[6400,6450],'#':[6500,6550]};
var ORDER = 'abcdefghijklmnopqrstuvwxyz0123456789 .,?!-@#';
var LEADER = [120, 160];
var ENDTONE = [6800, 6900];
var TONE_LEN = 0.08, GAP = 0.03, CHAR_GAP = 0.06;

function checksumChar(msg) {
  var s = 0;
  for (var i = 0; i < msg.length; i++) s += ORDER.indexOf(msg[i]);
  return ORDER[s % ORDER.length];
}

function encode(msg, sr) {
  sr = sr || 48000;
  var out = [];
  function tone(f, len) {
    var n = Math.floor(sr * len), i;
    for (i = 0; i < n; i++) out.push(Math.sin(2 * Math.PI * f * i / sr) * 0.5);
  }
  function silence(len) {
    var n = Math.floor(sr * len);
    for (var i = 0; i < n; i++) out.push(0);
  }
  var i, ch, fr;
  for (i = 0; i < 3; i++) { tone(LEADER[0], TONE_LEN); tone(LEADER[1], TONE_LEN); silence(GAP); }
  silence(CHAR_GAP);
  var full = msg + checksumChar(msg);
  for (i = 0; i < full.length; i++) {
    ch = full[i]; fr = TONES[ch];
    if (!fr) continue;
    tone(fr[0], TONE_LEN); silence(GAP); tone(fr[1], TONE_LEN); silence(CHAR_GAP);
  }
  tone(ENDTONE[0], 0.2); tone(ENDTONE[1], 0.2);
  return { samples: Float32Array.from(out), sr: sr };
}

function probe(buf, sr, freq) {
  var n = buf.length;
  var k = 0.5 + (n * freq / sr);
  var w = 2 * Math.PI * k / n;
  var cw = Math.cos(w), c = 2 * cw;
  var s0 = 0, s1 = 0, s2 = 0, i;
  for (i = 0; i < n; i++) { s0 = buf[i] + c * s1 - s2; s2 = s1; s1 = s0; }
  var p = s1 * s1 + s2 * s2 - c * s1 * s2;
  return p / (n * n);
}

function winEnergy(samples, at, len) {
  var e = 0, i, end = Math.min(samples.length, at + len);
  for (i = at; i < end; i++) e += samples[i] * samples[i];
  return e / len;
}

function slice(samples, at, len) {
  var end = Math.min(samples.length, at + len);
  return samples.subarray(at, end);
}

function decode(samples, sr) {
  var toneN = Math.floor(sr * TONE_LEN);
  var gapN = Math.floor(sr * GAP);
  var cgapN = Math.floor(sr * CHAR_GAP);
  var i, at;

  var start = -1;
  var hop = Math.floor(sr * 0.02);
  function leaderHot(at) {
    if (winEnergy(samples, at, toneN) < 0.002) return false;
    var w = slice(samples, at, toneN);
    // leader tones play one after the other, so either one counts
    return probe(w, sr, LEADER[0]) > 0.01 || probe(w, sr, LEADER[1]) > 0.01;
  }
  for (at = 0; at + toneN < samples.length; at += hop) {
    if (leaderHot(at)) { start = at; break; }
  }
  if (start < 0) return { body: '', ok: false, reason: 'no leader found - was anything playing?' };

  // detection usually lands mid-leader, so walk back to the true onset
  var back = Math.floor(sr * 0.005);
  var guard = 0;
  while (guard++ < 200 && start - back >= 0) {
    if (!leaderHot(start - back)) break;
    start -= back;
  }

  at = start + 3 * (2 * toneN + gapN) + cgapN;

  var chars = [];
  for (var c = 0; c < 200; c++) {
    if (at + 2 * toneN > samples.length) break;

    var ea = slice(samples, at, toneN);
    if (probe(ea, sr, ENDTONE[0]) > 0.01 && winEnergy(samples, at, toneN) > 0.002) {
      at += toneN;
      var eb = slice(samples, at, toneN);
      if (probe(eb, sr, ENDTONE[1]) > 0.01) break;
    }

    var wa = slice(samples, at, toneN);
    var bestCh = null, bestE = 0;
    for (var k in TONES) {
      var e = probe(wa, sr, TONES[k][0]);
      if (e > bestE) { bestE = e; bestCh = k; }
    }
    if (bestE < 0.005) break;

    var wb = slice(samples, at + toneN + gapN, toneN);
    var eb2 = probe(wb, sr, TONES[bestCh][1]);
    chars.push(eb2 > 0.005 ? bestCh : '?');

    at += 2 * toneN + gapN + cgapN;
  }

  if (!chars.length) return { body: '', ok: false, reason: 'leader found but no characters decoded' };
  var got = chars.join('');
  var body = got.slice(0, -1), sum = got.slice(-1);
  if (checksumChar(body) !== sum) return { body: body, ok: false, reason: 'checksum mismatch - message got garbled' };
  return { body: body, ok: true, reason: '' };
}

function wavBytes(samples, sr) {
  var n = samples.length;
  var buf = new Uint8Array(44 + n * 2);
  function str(o, s) { for (var i = 0; i < s.length; i++) buf[o + i] = s.charCodeAt(i); }
  function u32(o, v) { buf[o] = v & 255; buf[o + 1] = (v >> 8) & 255; buf[o + 2] = (v >> 16) & 255; buf[o + 3] = (v >> 24) & 255; }
  function u16(o, v) { buf[o] = v & 255; buf[o + 1] = (v >> 8) & 255; }
  str(0, 'RIFF'); u32(4, 36 + n * 2); str(8, 'WAVE'); str(12, 'fmt ');
  u32(16, 16); u16(20, 1); u16(22, 1); u32(24, sr); u32(28, sr * 2); u16(32, 2); u16(34, 16);
  str(36, 'data'); u32(40, n * 2);
  for (var i = 0; i < n; i++) {
    var v = Math.max(-1, Math.min(1, samples[i]));
    u16(44 + i * 2, v < 0 ? Math.round(v * 32768) + 65536 : Math.round(v * 32767));
  }
  return buf;
}

function wavSamples(bytes) {
  var sr = bytes[24] | (bytes[25] << 8) | (bytes[26] << 16) | (bytes[27] << 24);
  var n = (bytes.length - 44) / 2;
  var out = new Float32Array(n);
  for (var i = 0; i < n; i++) {
    var v = bytes[44 + i * 2] | (bytes[45 + i * 2] << 8);
    if (v >= 32768) v -= 65536;
    out[i] = v / 32768;
  }
  return { samples: out, sr: sr };
}

// ---------- browser bits ----------
var msgEl = document.getElementById('msg'), outEl = document.getElementById('out');
var statusEl = document.getElementById('status'), logEl = document.getElementById('log');
var actx = null, playSrc = null, recorder = null, recChunks = [], lastEnc = null;

function log(t) {
  logEl.textContent += t + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}
function status(t, bad) {
  statusEl.textContent = t;
  statusEl.className = bad ? 'bad' : '';
}

document.getElementById('play').onclick = function () {
  var msg = msgEl.value.toLowerCase().split('').filter(function (c) { return ORDER.indexOf(c) >= 0; }).join('');
  if (!msg) { status('nothing to send - type something first', true); return; }
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  var enc = encode(msg, actx.sampleRate);
  lastEnc = enc;
  var buf = actx.createBuffer(1, enc.samples.length, actx.sampleRate);
  buf.getChannelData(0).set(enc.samples);
  stopPlay();
  playSrc = actx.createBufferSource();
  playSrc.buffer = buf;
  playSrc.connect(actx.destination);
  playSrc.start();
  status('playing "' + msg + '" (' + msg.length + ' chars)...');
  log('sent: ' + msg);
};
function stopPlay() { if (playSrc) { try { playSrc.stop(); } catch (e) {} playSrc = null; } }
document.getElementById('stopPlay').onclick = stopPlay;
document.getElementById('save').onclick = function () {
  if (!lastEnc) { status('play something first', true); return; }
  var bytes = wavBytes(lastEnc.samples, lastEnc.sr);
  var blob = new Blob([bytes], { type: 'audio/wav' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'soundpost.wav';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  log('saved wav (' + bytes.length + ' bytes)');
};
document.getElementById('wavfile').onchange = function () {
  var f = this.files[0];
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function () {
    var w = wavSamples(new Uint8Array(fr.result));
    var r = decode(w.samples, w.sr);
    if (r.ok) {
      outEl.value = r.body;
      status('file says: "' + r.body + '"');
      log('file: ' + r.body);
    } else {
      status('file decode failed: ' + r.reason, true);
      log('file decode failed: ' + r.reason);
    }
  };
  fr.readAsArrayBuffer(f);
};

var meterCv = document.getElementById('meter'), meterCtx = meterCv.getContext('2d');
var meterAn = null, meterOn = false;
function meterLoop() {
  if (!meterOn) { meterCtx.clearRect(0, 0, meterCv.width, meterCv.height); return; }
  var d = new Float32Array(meterAn.fftSize);
  meterAn.getFloatTimeDomainData(d);
  var e = 0, i;
  for (i = 0; i < d.length; i++) e += d[i] * d[i];
  var rms = Math.sqrt(e / d.length);
  var w = Math.min(1, rms * 4) * meterCv.width;
  meterCtx.clearRect(0, 0, meterCv.width, meterCv.height);
  meterCtx.fillStyle = rms > 0.2 ? '#c47a6a' : '#8fd4a0';
  meterCtx.fillRect(0, 0, w, meterCv.height);
  requestAnimationFrame(meterLoop);
}

document.getElementById('rec').onclick = function () {
  var self = this;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    recChunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = function (e) { if (e.data.size) recChunks.push(e.data); };
    recorder.start();
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var msrc = actx.createMediaStreamSource(stream);
    meterAn = actx.createAnalyser();
    meterAn.fftSize = 2048;
    msrc.connect(meterAn);
    meterOn = true;
    meterLoop();
    self.disabled = true;
    document.getElementById('dec').disabled = false;
    status('recording... play the message, then stop + decode');
  }).catch(function () { status('mic blocked - allow microphone access', true); });
};

document.getElementById('dec').onclick = function () {
  var self = this;
  if (!recorder) return;
  recorder.onstop = function () {
    recorder.stream.getTracks().forEach(function (t) { t.stop(); });
    var blob = new Blob(recChunks, { type: recorder.mimeType || 'audio/webm' });
    var fr = new FileReader();
    fr.onload = function () {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      actx.decodeAudioData(fr.result).then(function (buf) {
        var ch = buf.getChannelData(0);
        var r = decode(ch, buf.sampleRate);
        if (r.ok) {
          outEl.value = r.body;
          status('got it: "' + r.body + '"');
          log('recv: ' + r.body);
        } else {
          status('decode failed: ' + r.reason, true);
          log('decode failed: ' + r.reason);
        }
      }).catch(function () { status('could not read the recording', true); });
    };
    fr.readAsArrayBuffer(blob);
  };
  recorder.stop();
  meterOn = false;
  self.disabled = true;
  document.getElementById('rec').disabled = false;
  status('decoding...');
};
</script>
</body>
</html>
